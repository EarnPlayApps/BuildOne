name: BuildOne UI Integrity Check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/buildone-ui-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - '.github/workflows/buildone-ui-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate BuildOne UI contracts
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'BuildOne v1.0' index.html
          grep -q 'Start Auto Build' index.html
          grep -q 'Build Real Artifact' index.html
          grep -q 'preparePublish' index.html
          grep -q 'verifyAppAds' index.html
          grep -q 'function startBuild' index.html
          grep -q 'function poll' index.html
          grep -q 'function gate' index.html
      - name: Validate no stale AppForge references
        run: |
          set -euo pipefail
          if grep -Eiq 'AppForge|appforge' index.html; then
            echo 'ERROR: AppForge reference found in BuildOne UI'
            exit 1
          fi
      - name: Validate artifact download contract
        run: |
          set -euo pipefail
          grep -q 'artifact_id' index.html
          grep -q 'run_id' index.html || { echo 'ERROR: UI does not pass run_id to artifact endpoint'; exit 1; }
          grep -q "type=.*state.artifact" index.html || { echo 'ERROR: UI does not pass artifact type'; exit 1; }
      - name: Validate AdMob fields
        run: |
          set -euo pipefail
          grep -q 'adBanner' index.html
          grep -q 'adInterstitial' index.html || { echo 'ERROR: Interstitial Ad Unit field missing'; exit 1; }
