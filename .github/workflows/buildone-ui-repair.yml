name: BuildOne UI Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/buildone-ui-repair.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair BuildOne UI contracts
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'id="adInterstitial"' not in s:
              needle='id="adBanner"'; pos=s.find(needle)
              if pos>=0:
                  end=s.find('>',pos)
                  if end>=0: s=s[:end+1]+'<input id="adInterstitial" placeholder="Interstitial Ad Unit ID" />'+s[end+1:]
          s=s.replace("state.admob={app:a,banner:b,valid:ok};", "state.admob={app:a,banner:b,interstitial:i,valid:ok};")
          s=s.replace("const a=$('adApp').value.trim(),b=$('adBanner').value.trim(),ok=/^ca-app-pub-\\d{16}~\\d{10}$/.test(a)&&/^ca-app-pub-\\d{16}\\/\\d{10}$/.test(b);", "const a=$('adApp').value.trim(),b=$('adBanner').value.trim(),i=$('adInterstitial')?.value.trim()||'',ok=/^ca-app-pub-\\d{16}~\\d{10}$/.test(a)&&/^ca-app-pub-\\d{16}\\/\\d{10}$/.test(b)&&/^ca-app-pub-\\d{16}\\/\\d{10}$/.test(i);")
          marker="$('adBanner').value=state.admob.banner||''"
          if 'adInterstitial' in s and "$('adInterstitial').value=state.admob.interstitial||''" not in s and marker in s:
              s=s.replace(marker,marker+";if($('adInterstitial'))$('adInterstitial').value=state.admob.interstitial||''")
          old="location.href=state.connection.worker.replace(/\\/$/,'')+'/artifact?owner='+encodeURIComponent(o)+'&repo='+encodeURIComponent(r)+'&artifact_id='+encodeURIComponent(state.artifact.id)"
          new="location.href=state.connection.worker.replace(/\\/$/,'')+'/artifact?owner='+encodeURIComponent(o)+'&repo='+encodeURIComponent(r)+'&artifact_id='+encodeURIComponent(state.artifact.id)+'&run_id='+encodeURIComponent(state.artifact.run_id||state.artifact.runId||'')+'&type='+encodeURIComponent(state.artifact.type||state.buildType||'APK')"
          if old in s: s=s.replace(old,new)
          s=s.replace("state.artifact=a;", "state.artifact=a;state.artifact.run_id=a.run_id||a.runId||state.artifact.run_id;state.artifact.type=a.type||state.artifact.type||state.buildType||'APK';")
          s=s.replace('Firebase URL required','Cloudflare Worker URL required').replace('Firebase backend OK.','BuildOne Worker backend OK.')
          p.write_text(s)
          PY
      - name: Validate and self remove
        run: |
          test -s index.html
          grep -q 'adInterstitial' index.html
          grep -q 'run_id' index.html
          rm -f .github/workflows/buildone-ui-repair.yml
      - name: Commit repaired UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/buildone-ui-repair.yml
          git diff --cached --quiet || git commit -m 'BuildOne: complete UI AdMob and artifact gate integration'
          git push
